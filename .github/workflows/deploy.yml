name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The page queries the Wikibase live. This saves a copy of the same
      # query result as a fallback for when the endpoint cannot be reached.
      - name: Save a copy of the directory data
        run: node scripts/snapshot.mjs
        continue-on-error: true

      # Only these files are published. Nothing else in the repository is.
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets presentations _site/
          if [ -d data ]; then cp -R data _site/; fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
